services:
  app:
    build: .
    image: compound-management-system:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/compounddb
      DB_USERNAME: compound
      DB_PASSWORD: compound
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: compounddb
      POSTGRES_USER: compound
      POSTGRES_PASSWORD: compound
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compound -d compounddb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dbdata:
