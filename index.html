<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Component Tracking System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Automated Component Management</h1>
            <p><em>Designed and implemented a functional system to streamline the tracking and lifecycle management of industrial components within engineering environments.</em></p>
        </header>

        <main>
            <section class="form-section">
                <h2>Log New Component</h2>
                <form id="componentForm">
                    <div class="input-group">
                        <label for="name">Component Name</label>
                        <input type="text" id="name" required placeholder="e.g., ESP32 Microcontroller">
                    </div>
                    <div class="input-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="Processor/MCU">Processor/MCU</option>
                            <option value="Sensor">Sensor</option>
                            <option value="Actuator/Motor">Actuator/Motor</option>
                            <option value="Power/Silicon">Power/Silicon</option>
                            <option value="Hardware/Spares">Hardware/Spares</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="quantity">Stock Quantity</label>
                        <input type="number" id="quantity" required min="1" placeholder="0">
                    </div>
                    <button type="submit">Add to Inventory</button>
                </form>
            </section>

            <section class="table-section">
                <h2>Current Stock</h2>
                <table id="inventoryTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Component Name</th>
                            <th>Category</th>
                            <th>Stock Level</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Data populated by Java Backend -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script>
        // Fetch and render components
        async function loadComponents() {
            const response = await fetch('/api/components');
            const data = await response.json();
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            data.forEach(comp => {
                const status = comp.quantity < 10 ? '<span class="status low">Low Stock</span>' : '<span class="status optimal">Optimal</span>';
                tbody.innerHTML += `
                    <tr>
                        <td>${comp.id}</td>
                        <td>${comp.name}</td>
                        <td>${comp.category}</td>
                        <td>${comp.quantity}</td>
                        <td>${status}</td>
                    </tr>
                `;
            });
        }

        // Submit new component
        document.getElementById('componentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newComponent = {
                name: document.getElementById('name').value,
                category: document.getElementById('category').value,
                quantity: parseInt(document.getElementById('quantity').value)
            };

            await fetch('/api/components', {
                method: 'POST',
                body: JSON.stringify(newComponent)
            });

            document.getElementById('componentForm').reset();
            loadComponents();
        });

        // Initial load
        window.onload = loadComponents;
    </script>
</body>
</html>
