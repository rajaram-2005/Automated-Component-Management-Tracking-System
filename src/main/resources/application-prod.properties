# Production profile: PostgreSQL instead of the default H2 file database.
# Activate with --spring.profiles.active=prod (see docker-compose.yml).
#
# The Docker Compose stack provisions a PostgreSQL instance and sets these values
# automatically, so you only need to run:  docker compose up --build
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/compounddb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:compound}
spring.datasource.password=${DB_PASSWORD:compound}

# The compose stack provisions an empty database. Hibernate creates the schema on
# first boot; add Flyway migrations and switch to 'validate' for a hardened schema.
spring.jpa.hibernate.ddl-auto=update

# Keep the H2 console off in production.
spring.h2.console.enabled=false

# Use Flyway-style migrations for a production schema. Generate the initial schema
# from the entities, then flip to validate once the migration script is committed.
# spring.flyway.enabled=true
# spring.flyway.locations=classpath:db/migration

# Actuator endpoints only on the management port for prod.
management.endpoints.web.exposure.include=health,info
